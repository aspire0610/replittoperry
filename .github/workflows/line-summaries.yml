name: LINE scheduled summaries

on:
  workflow_dispatch:
    inputs:
      summary:
        description: Which summary to send manually
        type: choice
        options:
          - premarket
          - closing
        default: closing
        required: true
  schedule:
    - cron: "30 0 * * 1-5"
    - cron: "45 0 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "10 7 * * 1-5"
    - cron: "0 8 * * 1-5"

permissions: {}

concurrency:
  group: line-summaries-${{ (github.event.schedule == '30 0 * * 1-5' || github.event.schedule == '45 0 * * 1-5' || inputs.summary == 'premarket') && 'premarket' || 'closing' }}
  cancel-in-progress: false

jobs:
  send-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      SCHEDULE: ${{ github.event.schedule || (inputs.summary == 'premarket' && '30 0 * * 1-5' || '0 7 * * 1-5') }}
    steps:
      - name: Call the matching protected Vercel route
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${CRON_SECRET:-}" || -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::Add CRON_SECRET and VERCEL_AUTOMATION_BYPASS_SECRET as repository Actions secrets."
            exit 1
          fi

          case "$SCHEDULE" in
            "30 0 * * 1-5"|"45 0 * * 1-5")
              path="/api/market/line-premarket-summary"
              ;;
            "0 7 * * 1-5"|"10 7 * * 1-5"|"0 8 * * 1-5")
              path="/api/market/line-closing-summary"
              ;;
            *)
              echo "::error::Unexpected schedule; refusing to call any route."
              exit 1
              ;;
          esac
          echo "Calling $path for schedule $SCHEDULE."

          umask 077
          headers_file="$RUNNER_TEMP/line-summary-headers"
          response_file="$RUNNER_TEMP/line-summary-response.json"
          trap 'rm -f "$headers_file" "$response_file"' EXIT

          printf 'Authorization: Bearer %s\nx-vercel-protection-bypass: %s\n' \
            "$CRON_SECRET" "$VERCEL_AUTOMATION_BYPASS_SECRET" > "$headers_file"

          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 300 \
            --header @"$headers_file" \
            "https://tw-stock-dashboard-smoky.vercel.app${path}")"

          if [[ ! "$status" =~ ^2[0-9][0-9]$ ]]; then
            python - "$response_file" <<'PY'
          import json
          import sys

          try:
              with open(sys.argv[1], encoding="utf-8") as f:
                  data = json.load(f)
              fields = ("date", "reason", "error", "sent", "skipped", "failed")
              safe = {key: data[key] for key in fields if key in data}
              print("Vercel route response: " + json.dumps(safe, ensure_ascii=False)[:800])
          except (OSError, json.JSONDecodeError):
              print("Vercel route returned a non-JSON error response.")
          PY
            echo "::error::Vercel summary route returned HTTP $status."
            exit 1
          fi

          python - "$response_file" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          fields = (
              "date",
              "sent",
              "skipped",
              "skippedDisabled",
              "skippedUnlinked",
              "skippedAlreadySent",
              "failed",
              "reason",
          )
          print(json.dumps({key: data[key] for key in fields if key in data}, ensure_ascii=False))
          PY
