  <body>
    <svg aria-hidden="true" class="glass-filter-defs" xmlns="http://www.w3.org/2000/svg">
      <filter id="glass-refraction" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <feTurbulence
          type="fractalNoise"
          baseFrequency="0.012 0.018"
          numOctaves="2"
          seed="8"
          result="glass-noise"
        />
        <feDisplacementMap
          in="SourceGraphic"
          in2="glass-noise"
          scale="11"
          xChannelSelector="R"
          yChannelSelector="G"
        />
      </filter>
    </svg>
