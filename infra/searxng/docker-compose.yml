name: searxng

services:
  searxng:
    image: docker.io/searxng/searxng:${SEARXNG_VERSION:-2026.10.7-6671d89be}
    restart: unless-stopped
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:?Set SEARXNG_BASE_URL in .env}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_LIMITER: "true"
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./core-config:/etc/searxng
      - searxng-cache:/var/cache/searxng
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - backend

  valkey:
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  caddy:
    image: docker.io/caddy:2-alpine
    restart: unless-stopped
    environment:
      SEARXNG_AUTH_USERNAME: ${SEARXNG_AUTH_USERNAME:?Set SEARXNG_AUTH_USERNAME in .env}
      SEARXNG_AUTH_PASSWORD_HASH: ${SEARXNG_AUTH_PASSWORD_HASH:?Set SEARXNG_AUTH_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - searxng
    networks:
      - backend

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - caddy
    networks:
      - backend

networks:
  backend:

volumes:
  searxng-cache:
  valkey-data:
  caddy-data:
  caddy-config:
