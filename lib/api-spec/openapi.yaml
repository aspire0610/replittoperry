        weekday: { type: ["string", "null"], enum: [monday, tuesday, wednesday, thursday, friday, null] }
      required: [mode, sharesPerEntry, frequency]
    QuantBacktestMetrics:
      type: object
      additionalProperties: false
      properties:
        totalReturnPercent: { type: number }
        annualizedReturnPercent: { type: number }
        maxDrawdownPercent: { type: number }
        annualizedVolatilityPercent: { type: number }
        sharpeRatio: { type: number }
        tradeCount: { type: integer }
        closedTradeCount: { type: integer }
        winningTradeCount: { type: integer }
        winRatePercent: { type: ["number", "null"] }
        averageWinPercent: { type: ["number", "null"] }
        averageLossPercent: { type: ["number", "null"] }
        payoffRatio: { type: ["number", "null"] }
        finalEquity: { type: number }
        contributedCapital: { type: number }
        taiexReturnPercent: { type: number }
      required: [totalReturnPercent, annualizedReturnPercent, maxDrawdownPercent, annualizedVolatilityPercent, sharpeRatio, tradeCount, finalEquity, taiexReturnPercent]
    QuantTimingCandidateResult:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        closedTradeCount: { type: integer }
        winRatePercent: { type: ["number", "null"] }
        totalReturnPercent: { type: number }
        selected: { type: boolean }
      required: [name, closedTradeCount, winRatePercent, totalReturnPercent, selected]
    QuantTimingComparison:
      type: object
      additionalProperties: false
      properties:
        calibrationStartDate: { type: string, format: date }
        calibrationEndDate: { type: string, format: date }
        validationStartDate: { type: string, format: date }
        validationEndDate: { type: string, format: date }
        selectedCandidate: { type: string }
        calibrationCandidates:
          type: array
          minItems: 3
          maxItems: 3
          items: { $ref: "#/components/schemas/QuantTimingCandidateResult" }
        validation:
          type: object
          additionalProperties: false
          properties:
            closedTradeCount: { type: integer }
            winRatePercent: { type: ["number", "null"] }
            totalReturnPercent: { type: number }
            maxDrawdownPercent: { type: number }
          required: [closedTradeCount, winRatePercent, totalReturnPercent, maxDrawdownPercent]
      required: [calibrationStartDate, calibrationEndDate, validationStartDate, validationEndDate, selectedCandidate, calibrationCandidates, validation]
    QuantEquityPoint:
      type: object
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        equity: { type: number }
        taiexEquity: { type: number }
      required: [date, equity, taiexEquity]
    QuantTrade:
      type: object
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        ticker: { type: string }
        name: { type: string }
        side: { type: string, enum: [buy, sell] }
        shares: { type: integer }
        price: { type: number }
        commission: { type: number }
        transactionTax: { type: number }
        slippageCost: { type: number }
      required: [date, ticker, name, side, shares, price, commission, transactionTax]
    QuantCostStress:
      type: object
      additionalProperties: false
      properties:
        slippagePercentPerSide: { type: number }
        costMultiplier: { type: number }
        totalReturnPercent: { type: number }
        maxDrawdownPercent: { type: number }
        closedTradeCount: { type: integer }
        winRatePercent: { type: ["number", "null"] }
        averageWinPercent: { type: ["number", "null"] }
        averageLossPercent: { type: ["number", "null"] }
        payoffRatio: { type: ["number", "null"] }
      required: [slippagePercentPerSide, costMultiplier, totalReturnPercent, maxDrawdownPercent, closedTradeCount, winRatePercent, averageWinPercent, averageLossPercent, payoffRatio]
    QuantDataCoverage:
      type: object
      additionalProperties: false
      properties:
        requestedStartDate: { type: string, format: date }
        dataStartDate: { type: string, format: date }
        dataEndDate: { type: string, format: date }
        tradingDays: { type: integer }
        eligibleSecurities: { type: integer }
        twseRows: { type: integer }
        tpexRows: { type: integer }
        fetchedDays: { type: integer }
        cachedDays: { type: integer }
        dataFingerprint: { type: string }
        source: { type: string }
      required: [requestedStartDate, dataStartDate, dataEndDate, tradingDays, eligibleSecurities, twseRows, tpexRows, fetchedDays, cachedDays, dataFingerprint, source]
    QuantResearchResult:
      type: object
      additionalProperties: false
      properties:
        runId: { type: integer }
        hypothesis: { type: string }
        tickerFilter:
          type: ["string", "null"]
          minLength: 4
          maxLength: 10
          pattern: '^[0-9]{4,6}(\.(TW|TWO))?$'
        rangeMonths: { type: integer, enum: [3, 6, 12] }
        startingCapital: { type: number }
        topN: { type: integer }
        rebalance: { type: string, enum: [daily, weekly, monthly] }
        timingComparison:
          $ref: "#/components/schemas/QuantTimingComparison"
        costStress:
          $ref: "#/components/schemas/QuantCostStress"
        strategy:
          $ref: "#/components/schemas/QuantStrategy"
        metrics:
          $ref: "#/components/schemas/QuantBacktestMetrics"
        equityCurve:
          type: array
          maxItems: 400
          items:
            $ref: "#/components/schemas/QuantEquityPoint"
        trades:
          type: array
          maxItems: 300
          items:
            $ref: "#/components/schemas/QuantTrade"
        tradeLogTruncated: { type: boolean }
        aiSummary:
          type: ["string", "null"]
          maxLength: 240
        coverage:
          $ref: "#/components/schemas/QuantDataCoverage"
        aiProvider:
          type: string
          # OpenRouter remains for historical saved runs; Groq Free joins new quant runs.
          enum: [gemini, 1min_ai, agnes_ai, groq, ollama, openrouter]
        createdAt:
          type: string
          format: date-time
        disclaimer:
          type: string
          maxLength: 500
      required: [runId, hypothesis, rangeMonths, startingCapital, topN, rebalance, strategy, metrics, equityCurve, trades, tradeLogTruncated, coverage, aiProvider, createdAt, disclaimer]
    QuantResearchRunSummaryResponse:
      type: object
      additionalProperties: false
      properties:
        aiSummary: { type: string, minLength: 15, maxLength: 240 }
      required: [aiSummary]
    QuantResearchProgressEvent:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [progress] }
        stage: { type: string, enum: [strategy, market-data, backtest, summary, saving] }
        message: { type: string }
        current: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
      required: [type, stage, message]
    QuantResearchResultEvent:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [result] }
        result:
          $ref: "#/components/schemas/QuantResearchResult"
      required: [type, result]
    QuantResearchErrorEvent:
      type: object
      additionalProperties: false
      properties:
        type: { type: string, enum: [error] }
        message: { type: string }
      required: [type, message]
    QuantResearchStreamEvent:
      oneOf:
        - $ref: "#/components/schemas/QuantResearchProgressEvent"
        - $ref: "#/components/schemas/QuantResearchResultEvent"
        - $ref: "#/components/schemas/QuantResearchErrorEvent"
    QuantResearchRunSummary:
      type: object
      additionalProperties: false
      properties:
        runId: { type: integer }
        hypothesis: { type: string }
        createdAt: { type: string, format: date-time }
        totalReturnPercent: { type: number }
        dataStartDate: { type: string, format: date }
        dataEndDate: { type: string, format: date }
      required: [runId, hypothesis, createdAt, totalReturnPercent, dataStartDate, dataEndDate]
    QuantResearchRunList:
      type: object
      additionalProperties: false
      properties:
        runs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuantResearchRunSummary"
      required: [runs]
    PaperTradingAccountInput:
      type: object
      additionalProperties: false
      properties:
        startingCash:
          type: number
          minimum: 100000
          maximum: 100000000
      required: [startingCash]
    PaperTradeInput:
      type: object
      additionalProperties: false
      properties:
        ticker:
          type: string
          pattern: "^[A-Za-z0-9]{4,6}\\.(TW|TWO)$"
        side:
          type: string
          enum: [buy, sell]
        shares:
          type: integer
          minimum: 1
          maximum: 10000000
        price:
          type: number
          minimum: 0.01
          maximum: 1000000
      required: [ticker, side, shares, price]
    PaperTradingPosition:
      type: object
      additionalProperties: false
      properties:
        ticker: { type: string }
        name: { type: string }
        shares: { type: integer }
        averageCost: { type: number }
        latestClose: { type: ["number", "null"] }
        marketValue: { type: ["number", "null"] }
        unrealizedPnl: { type: ["number", "null"] }
      required: [ticker, name, shares, averageCost, latestClose, marketValue, unrealizedPnl]
    PaperTradingTrade:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer }
        ticker: { type: string }
        name: { type: string }
        side: { type: string, enum: [buy, sell] }
        shares: { type: integer }
        price: { type: number }
        grossAmount: { type: number }
        commission: { type: number }
        transactionTax: { type: number }
        realizedPnl: { type: number }
        tradingDate: { type: string, format: date }
