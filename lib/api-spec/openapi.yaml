      required: [id, ticker, name, side, shares, price, grossAmount, commission, transactionTax, realizedPnl, tradingDate, createdAt]
    PaperTradingPortfolio:
      type: object
      additionalProperties: false
      properties:
        initialized: { type: boolean }
        startingCash: { type: ["number", "null"] }
        cash: { type: ["number", "null"] }
        marketValue: { type: ["number", "null"] }
        equity: { type: ["number", "null"] }
        returnPercent: { type: ["number", "null"] }
        asOf: { type: ["string", "null"], format: date }
        positions:
          type: array
          items:
            $ref: "#/components/schemas/PaperTradingPosition"
        trades:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PaperTradingTrade"
        disclaimer: { type: string }
      required: [initialized, startingCash, cash, marketValue, equity, returnPercent, asOf, positions, trades, disclaimer]
